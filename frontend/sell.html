<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品を出品する — GALLERY 0</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="sell">
    <header class="header">
      <a class="logo" href="/index.html">GALLERY <i>0</i></a>
      <nav>
        <a href="/collection.html">作品</a
        ><a href="/about.html">私たちについて</a>
      </nav>
      <a class="header-cta" href="/collection.html"
        >COLLECT ART <span>↗</span></a
      >
    </header>
    <main class="sell-page">
      <p class="kicker">SELL YOUR ARTWORK</p>
      <h1>作品を<br /><em>出品する。</em></h1>
      <p class="sell-intro">
        作品の情報を入力してください。登録後、GALLERY
        0のコレクションに掲載されます。
      </p>
      <form class="sell-form">
        <label
          >作品名<input
            name="title"
            required
            placeholder="例：Blue Room" /></label
        ><label
          >アーティスト名<input
            name="artist"
            required
            placeholder="例：キム・ダヘ" /></label
        ><label
          >価格（JPY）
          <input
            name="price"
            required
            type="number"
            min="0"
            placeholder="800000" /></label
        ><label
          >カテゴリー<select name="category">
            <option value="PAINTING">Painting</option>
            <option value="PHOTOGRAPHY">Photography</option>
            <option value="OBJECT">Object</option>
            <option value="VIDEO">Video</option>
          </select></label
        ><label
          >制作年<input
            name="productionYear"
            required
            type="number"
            min="1000"
            max="9999"
            placeholder="2026" /></label
        ><label
          >素材<input name="material" placeholder="例：Oil on canvas" /></label
        ><label
          >幅（cm）<input
            name="width"
            required
            type="number"
            min="0.01"
            step="0.01"
            placeholder="53" /></label
        ><label
          >高さ（cm）<input
            name="height"
            required
            type="number"
            min="0.01"
            step="0.01"
            placeholder="45.5" /></label
        ><label
          >配送について<input
            name="shipping"
            placeholder="例：ご注文後 7〜10日" /></label
        ><label class="full"
          >作品画像・動画<input
            name="imageFile"
            required
            type="file"
            accept="image/*,video/*" /></label
        ><label class="full"
          >作品説明<textarea
            name="description"
            placeholder="作品についての説明を入力してください。"
          ></textarea></label
        ><button class="button" type="submit">作品を登録する <b>→</b></button>
      </form>
      <p class="sell-success" role="status">
        作品を登録しました。コレクションへの掲載準備ができました。
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
